name: Check uv Lock

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/uv_lock.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/uv_lock.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
