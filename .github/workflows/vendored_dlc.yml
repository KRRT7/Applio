name: Vendored Deep-Live-Cam

# _vendor/modules and _vendor/deep_live_cam are hacksider/Deep-Live-Cam at
# tools/vendoring/dlc-upstream.txt plus tools/vendoring/patches/dlc,
# generated by scripts/vendor_dlc.py (see _vendor/README.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream main moves on its own: this catches a patch that stopped
    # applying, or that names something upstream removed, within a day.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  current:
    name: Vendored Deep-Live-Cam is current
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # Regenerates both trees from the pin and the patches and fails if the
      # committed ones differ (a hand edit, or patches committed without the
      # regenerated trees).
      - run: uv run --no-project --python 3.12 scripts/vendor_dlc.py check
      # A patch whose new code names something upstream has since removed
      # still applies; only an undefined name gives it away.
      - name: ruff undefined names
        run: uvx ruff check --select F821 _vendor

  tests:
    name: Vendored code tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # The face-swap dependencies only: the vendored code and its tests do
      # not need torch.
      - run: uv sync --locked --only-group faceswap --only-group dev --python 3.12
      - run: >
          uv run --no-sync --with "onnxruntime>=1.17"
          pytest tests/test_live_pipeline.py tests/test_face_parser.py tests/test_vendor_dlc.py
          -q --color=yes --tb=short

  upstream:
    name: Patches apply to Deep-Live-Cam's latest main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # A bare sync moves to upstream's latest main and stops at the patch
      # that no longer applies.
      - name: Sync
        run: uv run --no-project --python 3.12 scripts/vendor_dlc.py sync
      - name: How far upstream moved
        if: always()
        run: |
          {
            echo "Deep-Live-Cam \`$(git show HEAD:tools/vendoring/dlc-upstream.txt | cut -c1-12)\` -> \`$(cut -c1-12 tools/vendoring/dlc-upstream.txt)\`"
            echo
            echo '```'
            git diff --stat -- _vendor | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ruff undefined names
        run: uvx ruff check --select F821 _vendor
      - run: uv sync --locked --only-group faceswap --only-group dev --python 3.12
      - name: Tests
        run: >
          uv run --no-sync --with "onnxruntime>=1.17"
          pytest tests/test_live_pipeline.py tests/test_face_parser.py
          -q --color=yes --tb=short

  report-scheduled-failure:
    # A failed scheduled run only notifies whoever last edited the cron line.
    # Keep one open issue, and add each further failed run to it until
    # someone closes it.
    name: Report scheduled failure
    needs: [upstream]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Vendored Deep-Live-Cam: patches fail on upstream main"
          body="Applying Applio's patches to hacksider/Deep-Live-Cam's latest \`main\` failed: $RUN_URL

          Usually a patch in \`tools/vendoring/patches/dlc/\` no longer applies (the Sync step names it), a patch's code names something upstream removed (the undefined-names step), or the tests caught a change. To fix it, run \`uv run --no-project scripts/vendor_dlc.py sync\`, resolve the patch in \`build/dlc\` and \`git am --continue\`, then \`export\` and \`sync\` again (see _vendor/README.md)."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
