name: Code Formatter

# Formatting is checked, not committed back: run `uv format --version 0.17.6`
# before pushing. What is formatted, and what is left alone (_vendor, the
# notebooks), is configured under [tool.ruff] in pyproject.toml.

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/code_formatter.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/code_formatter.yml'

permissions:
  contents: read

jobs:
  format:
    name: Code is formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      # Ruff is pinned so every machine formats the same way; bump it here
      # and in pyproject.toml's comment together, with a reformat commit.
      - name: uv format --check
        run: uv format --version 0.17.6 --check --diff
